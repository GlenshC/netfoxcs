[plugin]

name="NetfoxCS"
description="A lightweight C# wrapper for netfox, Godot's GDScript multiplayer/rollback addon. No proxy nodes, no duplicate node types in the editor, just PascalCase C# classes wrapping the existing GDScript nodes you already placed in your scene."
